<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(Poppins-Bold.ttf)}
html,body{margin:0;background:#000;overflow:hidden}
</style></head><body><canvas id=c width=1080 height=1920></canvas>
<script>
// Backyard bunker, part 1. Cross-section build, then the audience picks what gets added in part 2.
const C = document.getElementById('c'), X = C.getContext('2d'), W = 1080, H = 1920;
let T = null; window.setTiming = t => { T = t; };
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), sm = x => { x = cl(x); return x * x * (3 - 2 * x); }, eo = x => 1 - Math.pow(1 - cl(x), 3);

function label(s, x, y, tx, ty, a, col = '#ffd23f') { if (a <= 0) return; X.globalAlpha = a; X.strokeStyle = col; X.lineWidth = 4; X.beginPath(); X.moveTo(x, y); X.lineTo(tx, ty); X.stroke(); X.fillStyle = col; X.beginPath(); X.arc(x, y, 8, 0, 7); X.fill(); X.globalAlpha = 1; txt(s, tx, ty - 12, 42, col, tx < x ? 'right' : 'left', a); }
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const STONES = Array.from({ length: 70 }, () => [rnd() * 1080, 1000 + rnd() * 900, 6 + rnd() * 16]);
const GY = 900;                                  // ground surface
const RX0 = 300, RX1 = 800, RY0 = 1230, RY1 = 1600; // bunker room (inside)
function person(x, y, s, pose, t, a = 1) { if (a <= 0) return; X.save(); X.globalAlpha = a; X.translate(x, y); X.scale(s, s); X.lineCap = 'round';
  X.strokeStyle = '#2b2f3a'; X.lineWidth = 16; const leg = pose === 'sit' ? [[-10, 0, 30, 0, 34, 40], [10, 0, 46, 4, 50, 44]] : [[-8, 0, -18, 30, -20, 64], [8, 0, 18, 30, 20, 64]];
  for (const l of leg) { X.beginPath(); X.moveTo(l[0], l[1]); X.quadraticCurveTo(l[2], l[3], l[4], l[5]); X.stroke(); }
  X.fillStyle = '#3d7bd9'; X.beginPath(); X.roundRect(-24, -70, 48, 74, 18); X.fill();
  X.strokeStyle = '#3d7bd9'; X.lineWidth = 14; const sw = pose === 'dig' ? Math.sin(t * 9) : 0;
  X.beginPath(); X.moveTo(-18, -58); X.lineTo(-30 + sw * 10, pose === 'phone' ? -64 : -18 + sw * 12); X.stroke(); X.beginPath(); X.moveTo(18, -58); X.lineTo(pose === 'phone' ? 10 : 34 + sw * 18, pose === 'phone' ? -76 : -20 + sw * 20); X.stroke();
  if (pose === 'dig') { X.strokeStyle = '#8a5a30'; X.lineWidth = 8; X.beginPath(); X.moveTo(34 + sw * 18, -20 + sw * 20); X.lineTo(70 + sw * 30, 50 + sw * 20); X.stroke(); X.fillStyle = '#9aa4ad'; X.beginPath(); X.ellipse(74 + sw * 30, 60 + sw * 20, 16, 22, 0.3, 0, 7); X.fill(); }
  if (pose === 'phone') { X.fillStyle = '#111'; X.fillRect(0, -100, 22, 36); X.fillStyle = Math.sin(t * 20) > 0 ? '#ff3b3b' : '#fff'; X.fillRect(3, -96, 16, 26); }
  X.fillStyle = '#f1c7a4'; X.beginPath(); X.arc(0, -96, 26, 0, 7); X.fill(); X.restore(); }
function shotAt(t) { const S = T.segs; let i = 0; while (i < S.length - 1 && t >= S[i + 1].start) i++; const s = S[i]; return { name: s.shot, u: cl((t - s.start) / s.dur), i }; }
const ORDER = ['yard', 'alert', 'dig', 'deep', 'walls', 'roof', 'door', 'air', 'water', 'light', 'safe', 'choice', 'end'];
window.frame = (t) => {
  if (!T) return; const sh = shotAt(t), k = ORDER.indexOf(sh.name), u = sh.u, at = n => sh.name === n, past = n => k > ORDER.indexOf(n), from = n => k >= ORDER.indexOf(n);

  // sky

  const shake = at('safe') && u > 0.4 ? Math.exp(-(u - 0.4) * 6) * 14 : 0;
  X.save(); X.translate(540 + (Math.random() - 0.5) * shake, 1080 + (Math.random() - 0.5) * shake); X.scale(c.s, c.s); X.translate(-540, -c.y);
  // sun / distant flash
  X.fillStyle = '#ffe58a'; X.beginPath(); X.arc(880, 260, 70, 0, 7); X.fill();
  if (at('safe') && u > 0.38) { const f = Math.exp(-(u - 0.38) * 5); X.fillStyle = `rgba(255,220,160,${0.9 * f})`; X.fillRect(-300, -400, 1700, GY + 400); }
  // fence + tree
  X.fillStyle = '#c9a77a'; for (let x = -100; x < 1200; x += 46) X.fillRect(x, GY - 150, 34, 150); X.fillRect(-100, GY - 120, 1300, 12);
  X.fillStyle = '#6b4a2a'; X.fillRect(110, GY - 330, 34, 330); X.fillStyle = '#3f9a4a'; for (const [x, y, r] of [[127, GY - 360, 90], [70, GY - 300, 70], [190, GY - 300, 70]]) { X.beginPath(); X.arc(x, y, r, 0, 7); X.fill(); }
  // dirt cross-section
  const dg = X.createLinearGradient(0, GY, 0, 1900); dg.addColorStop(0, '#6b4a2e'); dg.addColorStop(1, '#3a2716'); X.fillStyle = dg; X.fillRect(-300, GY, 1700, 1200);
  X.fillStyle = '#4f9b3f'; X.fillRect(-300, GY - 14, 1700, 24);

  const roofOn = from('roof') ? (at('roof') ? sm(u / 0.5) : 1) : 0;
  if (depth > GY + 4) { X.fillStyle = '#1b130c'; X.fillRect(RX0, GY, RX1 - RX0, depth - GY); }
  if (from('roof')) { const fill = at('roof') ? sm((u - 0.4) / 0.5) : 1; X.fillStyle = '#5d4128'; X.fillRect(RX0 - 20, lerp(GY, RY0 - 40, 1) - (RY0 - 40 - GY) * fill, RX1 - RX0 + 40, (RY0 - 40 - GY) * fill); }
  // dirt pile thrown up while digging
  const pile = at('dig') ? sm(u) : (at('deep') ? 1 : (from('walls') && !past('roof') ? (at('roof') ? 1 - sm((u - 0.4) / 0.5) : 1) : 0));
  if (pile > 0.01) { X.fillStyle = '#7a5434'; X.beginPath(); X.ellipse(940, GY, 220 * pile, 120 * pile, 0, Math.PI, 0); X.fill(); }
  if (at('dig') || at('deep')) for (let q = 0; q < 6; q++) { const ph = (t * 1.6 + q / 6) % 1; X.fillStyle = '#7a5434'; X.beginPath(); X.arc(lerp(620, 900, ph), depth - 40 - Math.sin(ph * Math.PI) * 300 + (GY - depth) * (1 - ph) * 0.3, 10, 0, 7); X.fill(); }
  // concrete shell
  if (from('walls')) { const w = at('walls') ? sm(u / 0.7) : 1; X.fillStyle = '#9aa1a8'; const th = 30;
    X.fillRect(RX0 - th, RY1 - (RY1 - RY0 + th) * w, th, (RY1 - RY0 + th) * w); X.fillRect(RX1, RY1 - (RY1 - RY0 + th) * w, th, (RY1 - RY0 + th) * w); X.fillRect(RX0 - th, RY1, RX1 - RX0 + 2 * th, th);
    X.fillStyle = 'rgba(0,0,0,.15)'; for (let y = RY1; y > RY1 - (RY1 - RY0) * w; y -= 40) { X.fillRect(RX0 - th, y, th, 2); X.fillRect(RX1, y, th, 2); } }
  if (from('roof')) { const r = at('roof') ? back(u / 0.4) : 1; X.save(); X.translate(550, RY0 - 15); X.scale(r, 1); X.fillStyle = '#8a9198'; X.fillRect(-(RX1 - RX0) / 2 - 30, -20, RX1 - RX0 + 60, 40); X.restore(); }
  // interior + hatch shaft
  if (from('roof')) { X.fillStyle = '#26211c'; X.fillRect(RX0, RY0, RX1 - RX0, RY1 - RY0); }
  if (from('door')) { const d = at('door') ? sm(u / 0.5) : 1; X.fillStyle = '#9aa1a8'; X.fillRect(RX0 + 30, GY - 6, 24, (RY0 - GY) * d); X.fillRect(RX0 + 130, GY - 6, 24, (RY0 - GY) * d); X.fillStyle = '#1b130c'; X.fillRect(RX0 + 54, GY, 76, (RY0 - GY) * d);
    X.strokeStyle = '#b07a3a'; X.lineWidth = 6; for (let y = GY + 30; y < GY + (RY1 - 40 - GY) * d; y += 46) { X.beginPath(); X.moveTo(RX0 + 62, y); X.lineTo(RX0 + 122, y); X.stroke(); } X.beginPath(); X.moveTo(RX0 + 62, GY); X.lineTo(RX0 + 62, GY + (RY1 - 40 - GY) * d); X.moveTo(RX0 + 122, GY); X.lineTo(RX0 + 122, GY + (RY1 - 40 - GY) * d); X.stroke();
    const open = at('safe') ? 1 - sm((u - 0.15) / 0.2) : (from('door') ? (at('door') ? 1 - sm((u - 0.6) / 0.3) : 0) : 0); X.save(); X.translate(RX0 + 30, GY - 6); X.rotate(-open * 1.4); X.fillStyle = '#5d666f'; X.beginPath(); X.roundRect(0, -26, 124, 30, 6); X.fill(); X.fillStyle = '#c94a3a'; X.beginPath(); X.arc(62, -32, 12, 0, 7); X.fill(); X.restore(); }
  // air vent + filter
  if (from('air')) { const a = at('air') ? sm(u / 0.5) : 1; X.fillStyle = '#b5bcc3'; X.fillRect(RX1 - 80, lerp(RY0, GY - 120, a), 34, (RY0 - (GY - 120)) * a); if (a > 0.95) { X.fillStyle = '#b5bcc3'; X.beginPath(); X.roundRect(RX1 - 100, GY - 150, 74, 40, 12); X.fill(); }
    if (a > 0.6) { X.fillStyle = '#f2f2f2'; X.fillRect(RX1 - 96, RY0 + 10, 66, 50); X.strokeStyle = '#999'; X.lineWidth = 2; for (let x = RX1 - 92; x < RX1 - 34; x += 8) { X.beginPath(); X.moveTo(x, RY0 + 12); X.lineTo(x, RY0 + 58); X.stroke(); } }
    for (let q = 0; q < 8; q++) { const ph = (t * 0.8 + q / 8) % 1; X.fillStyle = `rgba(200,240,255,${0.7 * (1 - ph)})`; X.beginPath(); X.arc(RX1 - 63 + Math.sin(q + t * 3) * 6, lerp(GY - 110, RY0 + 80, ph), 6, 0, 7); X.fill(); } }
  // water tank
  if (from('water')) { const a = at('water') ? back(u / 0.35) : 1; X.save(); X.translate(RX1 - 110, RY1); X.scale(a, a); X.fillStyle = '#d6dde3'; X.beginPath(); X.roundRect(-70, -200, 140, 200, 18); X.fill(); const lv = at('water') ? sm((u - 0.3) / 0.6) : 1; X.fillStyle = '#3aa8f0'; X.beginPath(); X.roundRect(-58, -12 - 176 * lv, 116, 176 * lv, 10); X.fill(); X.restore(); }
  // battery + bulb
  if (from('light')) { const a = at('light') ? back(u / 0.35) : 1; X.save(); X.translate(RX0 + 250, RY1); X.scale(a, a); X.fillStyle = '#2d3238'; X.beginPath(); X.roundRect(-60, -80, 120, 80, 10); X.fill(); X.fillStyle = '#ffd23f'; X.fillRect(-30, -96, 18, 16); X.fillStyle = '#7ad36b'; X.fillRect(-46, -60, 92 * (0.6 + 0.4 * Math.abs(Math.sin(t))), 20); X.restore();
    const on = at('light') ? sm((u - 0.4) / 0.2) : 1; X.strokeStyle = '#111'; X.lineWidth = 5; X.beginPath(); X.moveTo(RX0 + 250, RY1 - 80); X.quadraticCurveTo(RX0 + 300, RY0 + 120, 560, RY0 + 30); X.stroke();
    X.save(); X.shadowColor = '#ffe9a0'; X.shadowBlur = 80 * on; X.fillStyle = on > 0.5 ? '#fff3c4' : '#777'; X.beginPath(); X.arc(560, RY0 + 50, 22, 0, 7); X.fill(); X.restore();
    if (on > 0) { const lg = X.createRadialGradient(560, RY0 + 50, 10, 560, RY0 + 160, 320); lg.addColorStop(0, `rgba(255,233,160,${0.35 * on})`); lg.addColorStop(1, 'rgba(255,233,160,0)'); X.fillStyle = lg; X.fillRect(RX0, RY0, RX1 - RX0, RY1 - RY0); } }
  // you
  if (at('yard')) person(600, GY - 30, 1.3, 'sit', t);
  if (at('yard')) { X.fillStyle = '#e94b3c'; X.fillRect(560, GY - 40, 110, 14); X.fillRect(650, GY - 110, 14, 84); }
  if (at('alert')) person(600, GY - 6, 1.3, 'phone', t);
  if (at('dig') || at('deep')) person(560, depth - 4, 1.2, 'dig', t);
  if (at('safe') || at('choice') || at('end')) person(at('safe') ? lerp(RX0 + 92, 470, sm((u - 0.1) / 0.3)) : 470, RY1 - 4, 1.2, 'stand', t);
  // labels
  label('3 m of dirt', RX0 - 10, lerp(GY, RY1, 0.5), 60, 1180, at('deep') ? cl((u - 0.5) / 0.2) : 0); if (at('deep')) { X.strokeStyle = '#ffd23f'; X.lineWidth = 4; X.setLineDash([12, 10]); X.beginPath(); X.moveTo(RX0 - 10, GY); X.lineTo(RX0 - 10, depth); X.stroke(); X.setLineDash([]); }
  label('CONCRETE', RX1 + 15, 1450, 760, 1720, at('walls') ? cl((u - 0.4) / 0.2) : 0); label('HATCH', RX0 + 90, GY - 30, 520, GY - 190, at('door') ? cl((u - 0.3) / 0.2) : 0);
  label('FILTER', RX1 - 60, RY0 + 30, 600, RY0 - 70, at('air') ? cl((u - 0.5) / 0.2) : 0); label('WATER', RX1 - 110, RY1 - 120, 560, RY0 + 110, at('water') ? cl((u - 0.3) / 0.2) : 0); label('BATTERY', RX0 + 250, RY1 - 60, 420, RY1 + 130, at('light') ? cl((u - 0.3) / 0.2) : 0);
  X.restore();
  // phone alert overlay
  if (at('alert')) { const a = sm(u / 0.12) * (1 - sm((u - 0.9) / 0.1)); const s = back(u / 0.2); X.save(); X.globalAlpha = a; X.fillStyle = 'rgba(0,0,0,.45)'; X.fillRect(0, 0, W, H); X.translate(540, 1000); X.scale(s, s);
    X.fillStyle = '#16181d'; X.beginPath(); X.roundRect(-300, -560, 600, 1120, 60); X.fill(); X.fillStyle = '#2a2d34'; X.beginPath(); X.roundRect(-270, -520, 540, 1040, 40); X.fill();
    X.fillStyle = Math.sin(t * 12) > 0 ? '#d42d2d' : '#a01f1f'; X.beginPath(); X.roundRect(-250, -300, 500, 380, 30); X.fill();
    txt('⚠ EMERGENCY ALERT', 0, -220, 44, '#fff'); txt('Incoming threat.', 0, -130, 40, '#fff'); txt('Take shelter', 0, -60, 52, '#fff'); txt('IMMEDIATELY.', 0, 10, 52, '#ffd23f'); X.restore(); }

    txt('PART 2: YOU PICK', 540, 430, 70, '#ffd23f', 'center', a); txt('What do we add next?', 540, 510, 44, '#ffffff', 'center', a);
    const opts = [['1', 'Escape tunnel', '#5ec3ff'], ['2', 'Underground farm', '#6af0a8'], ['3', 'Secret entrance', '#ff8a5e']];
    opts.forEach(([n, s, col], i) => { const b = at('choice') ? back((u - 0.45 - i * 0.1) / 0.2) : 1; if (b <= 0) return; X.save(); X.translate(540, 720 + i * 250); X.scale(b, b); X.globalAlpha = a; X.fillStyle = 'rgba(255,255,255,.08)'; X.beginPath(); X.roundRect(-430, -95, 860, 190, 36); X.fill(); X.strokeStyle = col; X.lineWidth = 6; X.stroke();
      X.fillStyle = col; X.beginPath(); X.arc(-330, 0, 62, 0, 7); X.fill(); txt(n, -330, 26, 76, '#10141c'); txt(s, -230, 22, 56, '#fff', 'left'); X.restore(); });
    txt('Comment 1, 2 or 3', 540, 1560, 54, '#fff', 'center', a); txt('Top comment gets built.', 540, 1640, 48, '#ffd23f', 'center', a); } }
  // captions (one word at a time), hidden on the alert + choice screens
  if (!at('alert') && !(at('choice') && u > 0.35) && !at('end')) { const seg = T.segs[sh.i]; let word = '', wt0 = 0; for (const [w, wt] of seg.words || []) if (t >= wt) { word = w; wt0 = wt; }
    if (word) { const pop = 1 + 0.12 * Math.exp(-(t - wt0) * 12); X.save(); X.translate(540, 300); X.scale(pop, pop); txt(word.replace(/[.,]/g, '').toUpperCase(), 0, 0, 100, /fallout|air|water|deep|sealed/i.test(word) ? '#ffd23f' : '#ffffff'); X.restore(); } }
};
