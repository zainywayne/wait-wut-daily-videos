<!doctype html><html><head><style>
@font-face{font-family:MO;src:url(mono.ttf)}
html,body{margin:0;background:#000;overflow:hidden}
#cap{position:absolute;left:0;right:0;top:12%;text-align:center;font:700 40px MO;color:#f2f2ee;letter-spacing:1px;line-height:1.25;
 text-shadow:0 2px 0 #000,0 -2px 0 #000,2px 0 0 #000,-2px 0 0 #000,0 4px 14px rgba(0,0,0,.8);padding:0 60px}
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;font:700 40px MO;color:#f2f2ee;text-align:center;background:rgba(0,0,0,.6)}
#end b{color:#d8b830;font-size:34px;margin-top:16px}
</style></head><body><canvas id=c width=720 height=1280 style="width:720px;height:1280px"></canvas><div id=cap></div><div id=end>Choose your planet<b>one, two, or three?</b></div>
<script src="node_modules/three/build/three.min.js"></script><script src="world.js"></script>
<script>
window.frame=(t)=>{const shot=renderAt(t);const segs=TIMING.segs;let i=0;while(i<segs.length-1&&t>=segs[i+1].start)i++;
 const ws=segs[i].words;let k=-1;for(let j=0;j<ws.length;j++)if(t>=ws[j][1])k=j;
 const cap=document.getElementById('cap');
 if(k<0||t>segs[i].start+segs[i].dur-0.05){cap.textContent='';}else{const g=Math.floor(k/5)*5;cap.textContent=ws.slice(g,Math.min(ws.length,k+1)).map(w=>w[0]).join(' ');}
 document.getElementById('end').style.display=shot==='end'?'flex':'none';return shot;};
</script></body></html>
