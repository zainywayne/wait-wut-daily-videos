<script>
window.frame=(t)=>{const shot=renderAt(t);const segs=TIMING.segs;let i=0;while(i<segs.length-1&&t>=segs[i+1].start)i++;
 const ws=segs[i].words;let k=-1;for(let j=0;j<ws.length;j++)if(t>=ws[j][1])k=j;
 const cap=document.getElementById('cap');
 cap.textContent=(k<0||t>segs[i].start+segs[i].dur-0.05)?'':ws[k][0].replace(/[.,!?;:]+$/,'');
 document.getElementById('end').style.display=shot==='end'?'flex':'none';return shot;};
